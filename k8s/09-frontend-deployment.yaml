# Deployment du frontend (Nginx) : sert le site et relaie /api vers le backend.
# Nginx ne garde aucune donnée : on peut lancer plusieurs replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  # 3 replicas (démonstration GitOps : changement poussé par Git, appliqué par Argo CD).
  replicas: 3
  # Le Deployment gère les pods qui portent ces labels.
  selector:
    matchLabels:
      app: bijouterie
      tier: frontend
  # Modèle des pods créés par le Deployment.
  template:
    metadata:
      labels:
        app: bijouterie
        tier: frontend
    spec:
      containers:
        - name: frontend
          # Image publiée par Jenkins, tag = numéro de build (mis à jour par le stage
          # Update manifests). Tag explicite : latest est interdit.
          image: pamalick/bijouterie-frontend:11
          ports:
            - name: http
              containerPort: 80    # port d'écoute de Nginx
          # BACKEND_URL et MAX_UPLOAD_SIZE viennent de la ConfigMap.
          envFrom:
            - configMapRef:
                name: frontend-config
          # requests : ce que le scheduler réserve sur le nœud.
          # limits : le maximum autorisé avant bridage (CPU) ou arrêt (mémoire).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # /healthz est une route de santé prévue dans la config Nginx.
          # Liveness : le pod est redémarré si Nginx ne répond plus.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness : le pod ne reçoit du trafic que lorsqu'il est prêt.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
