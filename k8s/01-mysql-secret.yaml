# Secret de MySQL : les identifiants de la base.
# Les valeurs sont encodées en base64 (echo -n 'valeur' | base64).
# Attention : base64 est un simple encodage, pas un chiffrement. N'importe qui
# peut décoder ces valeurs. Le commit dans Git est toléré pour ce TP seulement.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
# Opaque = Secret générique, fait de paires clé/valeur libres.
type: Opaque
data:
  # Mot de passe du compte root de MySQL.
  MYSQL_ROOT_PASSWORD: QW1pbmEtUm9vdC0yMDI2
  # Base créée au premier démarrage (même valeur que DB_NAME du backend).
  MYSQL_DATABASE: Ymlqb3V0ZXJpZQ==
  # Compte applicatif créé au premier démarrage, utilisé par le backend.
  MYSQL_USER: YW1pbmE=
  MYSQL_PASSWORD: QW1pbmEtQmlqb3V4LTIwMjY=
