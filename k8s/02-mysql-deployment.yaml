# Deployment de la base MySQL.
# Bonus : les données sont stockées sur le volume persistant mysql-pvc
# (fichier 11), elles survivent donc à la suppression du pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  # Une seule instance : plusieurs pods MySQL n'auraient pas les mêmes données.
  replicas: 1
  # Recreate : l'ancien pod est arrêté avant de créer le nouveau, pour ne
  # jamais avoir deux MySQL en même temps.
  strategy:
    type: Recreate
  # Le Deployment gère les pods qui portent ces labels.
  selector:
    matchLabels:
      app: bijouterie
      tier: database
  # Modèle des pods créés par le Deployment.
  template:
    metadata:
      labels:
        app: bijouterie
        tier: database
    spec:
      containers:
        - name: mysql
          # Bonus : image officielle, le script init.sql vient de la
          # ConfigMap mysql-initdb (fichier 12). Tag explicite, pas latest.
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          # envFrom : toutes les clés du Secret deviennent des variables
          # d'environnement du même nom (MYSQL_ROOT_PASSWORD, etc.).
          envFrom:
            - secretRef:
                name: mysql-secret
          # requests : ce que le scheduler réserve sur le nœud.
          # limits : le maximum autorisé avant bridage (CPU) ou arrêt (mémoire).
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Le pod n'est déclaré prêt que lorsque MySQL accepte les connexions.
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 5
          # Le dossier des données MySQL est monté sur le volume persistant.
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            # Le script init.sql est monté dans le dossier lu par l'image MySQL.
            - name: mysql-initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        # Volume des données, rattaché au PVC mysql-pvc.
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        # Volume du script d'initialisation, rempli par la ConfigMap.
        - name: mysql-initdb
          configMap:
            name: mysql-initdb
