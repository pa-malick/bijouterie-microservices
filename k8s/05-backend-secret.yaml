# Secret du backend : les identifiants de connexion à MySQL.
# Ils doivent correspondre à MYSQL_USER et MYSQL_PASSWORD de mysql-secret,
# sinon MySQL répond « Access denied ».
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
type: Opaque
data:
  # Mêmes valeurs base64 que MYSQL_USER et MYSQL_PASSWORD.
  DB_USER: YW1pbmE=
  DB_PASSWORD: QW1pbmEtQmlqb3V4LTIwMjY=
